<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prebid Local Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 32px;
      background: #f5f7fb;
      color: #1f2937;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      max-width: 720px;
    }
    .status {
      margin: 12px 0;
      padding: 12px;
      background: #eef2ff;
      border-radius: 8px;
    }
    #ad-slot {
      width: 300px;
      height: 250px;
      border: 2px dashed #9ca3af;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .metrics {
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prebid Local Demo</h1>
    <p>Runs a stored-request auction through local Prebid Server and renders the mock bidder creative.</p>

    <div class="status" id="status">Status: Idle</div>
    <div class="metrics" id="metrics">Winning bid: N/A</div>

    <button id="run-auction">Run Auction</button>

    <div id="ad-slot">Ad renders here</div>
  </div>

  <script src="prebid.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const metricsEl = document.getElementById('metrics');
    const adSlot = document.getElementById('ad-slot');

    const adUnit = {
      code: 'ad-slot',
      mediaTypes: {
        banner: {
          sizes: [[300, 250]]
        }
      },
      ortb2Imp: {
        ext: {
          prebid: {
            storedrequest: {
              id: 'demo-imp'
            }
          }
        }
      },
      bids: [
        {
          bidder: 'appnexus',
          params: {
            placementId: 123456
          }
        }
      ]
    };

    pbjs.que.push(() => {
      pbjs.setConfig({
        s2sConfig: {
          accountId: 'demo',
          bidders: ['appnexus'],
          endpoint: 'http://localhost:8000/openrtb2/auction',
          syncEndpoint: 'http://localhost:8000/cookie_sync',
          timeout: 1200,
          enabled: true
        },
        ortb2: {
          ext: {
            prebid: {
              storedrequest: {
                id: 'demo-auction'
              }
            }
          }
        }
      });

      pbjs.addAdUnits([adUnit]);
    });

    function updateStatus(text) {
      statusEl.textContent = `Status: ${text}`;
    }

    function runAuction() {
      updateStatus('Auction started');
      metricsEl.textContent = 'Winning bid: N/A';
      adSlot.textContent = 'Loading...';

      pbjs.que.push(() => {
        pbjs.requestBids({
          bidsBackHandler: () => {
            updateStatus('Bids received');
            const bids = pbjs.getHighestCpmBids('ad-slot');
            if (!bids || bids.length === 0) {
              metricsEl.textContent = 'Winning bid: No bids';
              adSlot.textContent = 'No bid returned';
              return;
            }

            const winningBid = bids[0];
            metricsEl.textContent = `Winning bid: $${winningBid.cpm.toFixed(2)} CPM`;
            adSlot.innerHTML = '';
            pbjs.renderAd(adSlot, winningBid.adId);
          }
        });
      });
    }

    document.getElementById('run-auction').addEventListener('click', runAuction);

    window.addEventListener('load', () => {
      setTimeout(runAuction, 500);
    });
  </script>
</body>
</html>
